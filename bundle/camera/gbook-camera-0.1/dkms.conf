PACKAGE_NAME="gbook-camera"
PACKAGE_VERSION="0.1"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="intel_skl_int3472_discrete"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ipu-bridge"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="imx241"
DEST_MODULE_LOCATION[2]="/updates/dkms"
AUTOINSTALL="yes"
# int3472/ and ipu-bridge/ are copies of the 7.2.15 kernel sources with small
# additions, and imx241.c uses the 7.2 sub-device API: build for 7.2 kernels
# only. A newer kernel keeps its own int3472/ipu-bridge (camera not detected)
# until this package is ported.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
