# /etc/wireplumber/wireplumber.conf.d/60-gbook-camera.conf
# Galaxy Book 10.6 front camera: applications reach it through libcamera
# (ImgU processing). Hide the raw IPU3 V4L2 nodes (ImgU 00:05.0, CIO2 00:14.3), which are not cameras an
# application can use and would only show up as 14 bogus entries.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.pci-0000_00_05.0*" }
      { device.name = "~v4l2_device.pci-0000_00_14.3*" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "~libcamera_input.*" }
    ]
    actions = {
      update-props = { node.description = "전면 카메라" }
    }
  }
]
