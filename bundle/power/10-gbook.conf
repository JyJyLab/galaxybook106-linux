# /etc/systemd/logind.conf.d/10-gbook.conf — Galaxy Book 10.6 as a tablet
[Login]
# power button: sleep, then hibernate after HibernateDelaySec (sleep.conf.d/
# 20-gbook-hibernate.conf; this tablet never reaches S0ix, so plain sleep
# drains ~1.6 %/h); held for five seconds: power off
HandlePowerKey=suspend-then-hibernate
HandlePowerKeyLongPress=poweroff
# closing the keyboard cover over the screen (lid switch): the same; on the
# charger plain sleep
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
# react to the cover again five seconds after waking up (default: 30 s, during
# which closing the cover does nothing)
HoldoffTimeoutSec=5s
