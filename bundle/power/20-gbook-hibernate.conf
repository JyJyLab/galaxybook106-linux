# /etc/systemd/sleep.conf.d/20-gbook-hibernate.conf — Galaxy Book 10.6
# s2idle never reaches S0ix (SLP_S0 residency stays 0 although the CPU reaches
# PC10 and the display DC6), so sleep drains about 1.6 %/h. Hibernate after
# three hours of sleep instead.
# The firmware S4 path aborts while entering (an ACPI SCI arrives right after
# the image is saved: "Wakeup event detected during hibernation, rolling
# back"), so write the image and power off instead. Wake: power button (the
# RTC alarm does not start the tablet from off).
[Sleep]
HibernateMode=shutdown
HibernateDelaySec=3h
