# /etc/gbook/display.conf — Galaxy Book 10.6 display rotation settings
# A per-user copy in ~/.config/gbook/display.conf overrides these values.

# Internal panel connector. "auto" picks the first eDP/DSI/LVDS output.
OUTPUT=auto

# Transform that shows an upright picture when the tablet stands in its normal
# landscape position (keyboard cover at the bottom). The panel is mounted
# rotated, so this is 90 or 270.
#   SM-W627 (Galaxy Book 10.6 LTE): 90, confirmed on the device 2026-11-10.
#   SM-W620 (Wi-Fi): the kernel lists the panel as "right side up" -> expect 270.
BASE_TRANSFORM=90

# Output scale. 1 = native resolution (1920x1280 in landscape), chosen by the
# user on 2026-11-10; 1.5 gives larger elements at a logical 1280x853.
SCALE=1

# Degrees added to BASE_TRANSFORM for each sensor orientation reported by
# iio-sensor-proxy (orientation relative to the casing). Both landscape
# positions were confirmed on the device; the portrait ones follow from the
# corrected sensor matrix (61-sensor-galaxybook106.hwdb).
OFFSET_NORMAL=0
OFFSET_LEFT_UP=90
OFFSET_BOTTOM_UP=180
OFFSET_RIGHT_UP=270

# 1 = follow the accelerometer, 0 = never rotate automatically.
AUTOROTATE=1
